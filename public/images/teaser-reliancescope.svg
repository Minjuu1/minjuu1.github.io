<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <title>A student chats with an AI chatbot, and their chat log is mapped onto a three-by-three grid of reliance patterns where a magnifying glass highlights one cell</title>

  <rect width="480" height="270" fill="#f3f7f5"/>

  <!-- chat to grid -->
  <path d="M208 104C236 104 224 135 250 135" fill="none" stroke="#1f6b4f" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>

  <!-- speech bubbles -->
  <g stroke-linecap="round">
    <rect x="44" y="60" width="80" height="24" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
    <path d="M58 72H104" stroke="#9ca3af" stroke-width="2.5" fill="none"/>
    <rect x="118" y="92" width="86" height="24" rx="12" fill="#1f6b4f" stroke="#1f2937" stroke-width="2.5"/>
    <path d="M132 104H186" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  </g>

  <!-- student: coral striped shirt, brown bob -->
  <g stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(80 170) scale(1.6)" stroke-width="1.56"><path d="M-19 2Q-22 -27 0 -27Q22 -27 19 2Q20 10 14 10H-14Q-20 10 -19 2Z" fill="#8a5a3c"/></g>
    <path d="M46.4 210C46.4 194 57.6 186.8 80 185.2C102.4 186.8 113.6 194 113.6 210Z" fill="#f2a48c"/>
    <path d="M56 198H104M51 204H109" stroke="#ffffff" stroke-width="2" stroke-linecap="butt" fill="none"/>
    <path d="M72.8 174.8V181.2C72.8 184.4 70.4 186 67.2 186.8C72.8 195.6 87.2 195.6 92.8 186.8C90.4 186 88 184.4 87.2 181.2V174.8" fill="#ffffff"/>
    <circle cx="54.4" cy="160.4" r="6" fill="#ffffff"/>
    <circle cx="105.6" cy="160.4" r="6" fill="#ffffff"/>
    <circle cx="80" cy="157.2" r="25.6" fill="#ffffff"/>
    <circle cx="65.6" cy="168.4" r="5" fill="#f7b9b0" stroke="none"/>
    <circle cx="94.4" cy="168.4" r="5" fill="#f7b9b0" stroke="none"/>
    <g transform="translate(80 170) scale(1.6)" stroke-width="1.56"><path d="M-16 -8Q-17 -26 0 -26Q17 -26 16 -8Q10 -16 0 -15Q-10 -16 -16 -8Z" fill="#8a5a3c"/></g>
    <circle cx="73.6" cy="162" r="2" fill="#1f2937" stroke="none"/>
    <circle cx="86.4" cy="162" r="2" fill="#1f2937" stroke="none"/>
    <path d="M76 169Q80 173 84 169" fill="none" stroke-width="2"/>
  </g>

  <!-- chatbot -->
  <g stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 150.8V139.6" fill="none"/>
    <circle cx="180" cy="134.8" r="5.6" fill="#1f6b4f"/>
    <rect x="143.2" y="168.4" width="8" height="16" rx="4" fill="#cbd5d1"/>
    <rect x="208.8" y="168.4" width="8" height="16" rx="4" fill="#cbd5d1"/>
    <rect x="149.6" y="150.8" width="60.8" height="51.2" rx="16" fill="#e3f1eb"/>
    <rect x="159.2" y="162" width="41.6" height="24" rx="12" fill="#1f2937" stroke="none"/>
    <rect x="168" y="169.2" width="6.4" height="9.6" rx="3.2" fill="#e3f1eb" stroke="none"/>
    <rect x="185.6" y="169.2" width="6.4" height="9.6" rx="3.2" fill="#e3f1eb" stroke="none"/>
  </g>

  <!-- stage: 3x3 reliance grid -->
  <rect x="252" y="32" width="206" height="206" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <g stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round">
    <rect x="267" y="47" width="52" height="52" rx="10" fill="#e3f1eb"/>
    <rect x="329" y="47" width="52" height="52" rx="10" fill="#ffffff"/>
    <rect x="391" y="47" width="52" height="52" rx="10" fill="#e3f1eb"/>
    <rect x="267" y="109" width="52" height="52" rx="10" fill="#ffffff"/>
    <rect x="329" y="109" width="52" height="52" rx="10" fill="#1f6b4f"/>
    <rect x="391" y="109" width="52" height="52" rx="10" fill="#e3f1eb"/>
    <rect x="267" y="171" width="52" height="52" rx="10" fill="#e3f1eb"/>
    <rect x="329" y="171" width="52" height="52" rx="10" fill="#e3f1eb"/>
    <rect x="391" y="171" width="52" height="52" rx="10" fill="#ffffff"/>
  </g>

  <!-- magnifying glass -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(380.5 160.5) rotate(-45)">
      <rect x="-6.5" y="-2" width="13" height="44" rx="6.5" fill="#cbd5d1" stroke="#1f2937" stroke-width="2.5"/>
    </g>
    <circle cx="355" cy="135" r="36" fill="none" stroke="#1f2937" stroke-width="10"/>
    <circle cx="355" cy="135" r="36" fill="none" stroke="#ffffff" stroke-width="4.5"/>
    <path d="M333 124Q337 114 346 111" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
