<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <title>A student questions a chatbot's answer, and the same chat fills in a rubric of critical engagement</title>

  <rect width="480" height="270" fill="#f3f7f5"/>

  <!-- chat: AI answer (accent) with the student's ? check, student reply (white) -->
  <g stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="136" y="38" width="118" height="34" rx="12" fill="#1f6b4f"/>
    <path d="M152 49.5H236M152 60.5H206" stroke="#ffffff" fill="none"/>
    <rect x="40" y="86" width="96" height="26" rx="13" fill="#ffffff"/>
    <path d="M54 99H104" stroke="#9ca3af" fill="none"/>
    <circle cx="136" cy="40" r="12" fill="#ffffff"/>
    <text x="136" y="46.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2937" stroke="none">?</text>
  </g>

  <!-- chat to rubric -->
  <path d="M262 55C292 55 290 126 314 126" fill="none" stroke="#1f6b4f" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>

  <!-- student: sceptical look toward the bot (ink bob, striped yellow shirt) -->
  <g transform="translate(80 178) scale(1.8)" stroke="#1f2937" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-19 2Q-22 -27 0 -27Q22 -27 19 2Q20 10 14 10H-14Q-20 10 -19 2Z" fill="#1f2937"/>
    <path d="M-21 25C-21 15 -14 10.5 0 9.5C14 10.5 21 15 21 25Z" fill="#f6d58a"/>
    <path d="M-17 17.5H17M-18.5 22H18.5" stroke="#ffffff" stroke-width="1.1" stroke-linecap="butt" fill="none"/>
    <path d="M-4.5 3V7C-4.5 9 -6 10 -8 10.5C-4.5 16 4.5 16 8 10.5C6 10 4.5 9 4.5 7V3" fill="#ffffff"/>
    <circle cx="-16" cy="-6" r="3.8" fill="#ffffff"/>
    <circle cx="16" cy="-6" r="3.8" fill="#ffffff"/>
    <circle cx="0" cy="-8" r="16" fill="#ffffff"/>
    <circle cx="-8" cy="-1" r="3.2" fill="#f7b9b0" stroke="none"/>
    <circle cx="10" cy="-1" r="3.2" fill="#f7b9b0" stroke="none"/>
    <path d="M-16 -8Q-17 -26 0 -26Q17 -26 16 -8Q10 -16 0 -15Q-10 -16 -16 -8Z" fill="#1f2937"/>
    <circle cx="-2.5" cy="-5" r="1.1" fill="#1f2937" stroke="none"/>
    <circle cx="5.5" cy="-5" r="1.1" fill="#1f2937" stroke="none"/>
    <path d="M3 -9.5Q5.5 -11.5 8 -9.8" fill="none" stroke-width="1.1"/>
    <path d="M-1.5 1.5Q2 -0.3 5 1.2" fill="none" stroke-width="1.1"/>
  </g>

  <!-- chatbot -->
  <g transform="translate(222 192) scale(2)" stroke="#1f2937" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -17V-24" fill="none"/>
    <circle cx="0" cy="-27" r="3.5" fill="#1f6b4f"/>
    <rect x="-23" y="-6" width="5" height="10" rx="2.5" fill="#cbd5d1"/>
    <rect x="18" y="-6" width="5" height="10" rx="2.5" fill="#cbd5d1"/>
    <rect x="-19" y="-17" width="38" height="32" rx="10" fill="#e3f1eb"/>
    <rect x="-13" y="-10" width="26" height="15" rx="7.5" fill="#1f2937" stroke="none"/>
    <rect x="-8.5" y="-5.5" width="4" height="6" rx="2" fill="#e3f1eb" stroke="none"/>
    <rect x="2.5" y="-5.5" width="4" height="6" rx="2" fill="#e3f1eb" stroke="none"/>
  </g>

  <!-- rubric sheet: three rows, scores filling in -->
  <g stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="322" y="34" width="136" height="202" rx="16" fill="#ffffff"/>
    <text x="340" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1f2937" stroke="none">Rubric</text>
    <path d="M340 70H404M340 126H392M340 184H410" stroke="#9ca3af" fill="none"/>
    <g stroke-width="2">
      <rect x="340" y="78" width="16" height="16" rx="4" fill="#1f6b4f"/>
      <rect x="362" y="78" width="16" height="16" rx="4" fill="#1f6b4f"/>
      <rect x="384" y="78" width="16" height="16" rx="4" fill="#1f6b4f"/>
      <rect x="406" y="78" width="16" height="16" rx="4" fill="#ffffff"/>
      <rect x="340" y="136" width="16" height="16" rx="4" fill="#1f6b4f"/>
      <rect x="362" y="136" width="16" height="16" rx="4" fill="#1f6b4f"/>
      <rect x="384" y="136" width="16" height="16" rx="4" fill="#ffffff"/>
      <rect x="406" y="136" width="16" height="16" rx="4" fill="#ffffff"/>
      <rect x="340" y="194" width="16" height="16" rx="4" fill="#1f6b4f"/>
      <rect x="362" y="194" width="16" height="16" rx="4" fill="#ffffff"/>
      <rect x="384" y="194" width="16" height="16" rx="4" fill="#ffffff"/>
      <rect x="406" y="194" width="16" height="16" rx="4" fill="#ffffff"/>
    </g>
    <path d="M429 86L434 91L443 79" fill="none" stroke-width="3"/>
  </g>
</svg>
