<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <title>A person chats with an LLM on their phone, and the chat branches into three everyday uses: social validation, self-regulation, and interpersonal guidance</title>
  <defs>
    <g id="bot" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -17V-24" fill="none"/>
      <circle cx="0" cy="-27" r="3.5" fill="#1f6b4f"/>
      <rect x="-23" y="-6" width="5" height="10" rx="2.5" fill="#cbd5d1"/>
      <rect x="18" y="-6" width="5" height="10" rx="2.5" fill="#cbd5d1"/>
      <rect x="-19" y="-17" width="38" height="32" rx="10" fill="#e3f1eb"/>
      <rect x="-13" y="-10" width="26" height="15" rx="7.5" fill="#1f2937" stroke="none"/>
      <rect x="-7.5" y="-5.5" width="4" height="6" rx="2" fill="#e3f1eb" stroke="none"/>
      <rect x="3.5" y="-5.5" width="4" height="6" rx="2" fill="#e3f1eb" stroke="none"/>
    </g>
  </defs>

  <rect width="480" height="270" fill="#f3f7f5"/>

  <!-- chat to three uses -->
  <g fill="none" stroke="#1f6b4f" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round">
    <path d="M326 135C354 133 352 64 380 64"/>
    <path d="M326 135H380"/>
    <path d="M326 135C354 137 352 206 380 206"/>
    <path d="M132 204C142 204 146 196 154 196"/>
  </g>

  <!-- stage: the chat -->
  <rect x="156" y="22" width="168" height="226" rx="16" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <use href="#bot" transform="translate(240 74) scale(1.3)"/>
  <g stroke="#1f2937" stroke-width="2.5" stroke-linecap="round">
    <rect x="216" y="108" width="88" height="22" rx="11" fill="#ffffff"/>
    <path d="M230 119H286" stroke="#9ca3af" fill="none"/>
    <rect x="176" y="142" width="100" height="22" rx="11" fill="#1f6b4f"/>
    <path d="M190 153H258" stroke="#ffffff" fill="none"/>
    <rect x="226" y="176" width="78" height="22" rx="11" fill="#ffffff"/>
    <path d="M240 187H278" stroke="#9ca3af" fill="none"/>
    <rect x="176" y="210" width="84" height="22" rx="11" fill="#1f6b4f"/>
    <path d="M190 221H244" stroke="#ffffff" fill="none"/>
  </g>

  <!-- person with phone: ink hair with a top bun, lilac striped shirt -->
  <g stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 240C32 198 48 168 86 164C124 168 140 198 140 240Z" fill="#cdbdea"/>
    <circle cx="86" cy="76" r="12" fill="#1f2937"/>
    <path d="M37 216H135M34 228H138" stroke="#ffffff" stroke-width="2.5" stroke-linecap="butt" fill="none"/>
    <path d="M77 144V155C77 161 74 164 69 165.5C76 180 96 180 103 165.5C98 164 95 161 95 155V144" fill="#ffffff"/>
    <circle cx="52" cy="126" r="7" fill="#ffffff"/>
    <circle cx="120" cy="126" r="7" fill="#ffffff"/>
    <circle cx="86" cy="120" r="34" fill="#ffffff"/>
    <path d="M52 118Q50 82 86 82Q122 82 120 118Q105 99 86 101Q67 99 52 118Z" fill="#1f2937"/>
    <circle cx="66" cy="139" r="5.5" fill="#f7b9b0" stroke="none"/>
    <circle cx="106" cy="139" r="5.5" fill="#f7b9b0" stroke="none"/>
    <circle cx="80" cy="131" r="2" fill="#1f2937" stroke="none"/>
    <circle cx="92" cy="131" r="2" fill="#1f2937" stroke="none"/>
    <path d="M82 137Q86 144 90 137Z" fill="#1f2937" stroke-width="1.5"/>
    <!-- phone in hand -->
    <rect x="106" y="184" width="26" height="42" rx="6" fill="#cbd5d1"/>
    <rect x="111" y="190" width="16" height="26" rx="3" fill="#ffffff" stroke-width="2"/>
    <circle cx="116" cy="228" r="8" fill="#ffffff"/>
  </g>

  <!-- three uses -->
  <g stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- social validation: check in a bubble -->
    <circle cx="410" cy="64" r="28" fill="#f6d58a"/>
    <path d="M400 51H420Q428 51 428 59V65Q428 73 420 73H405L397 79L398 72Q392 70 392 65V59Q392 51 400 51Z" fill="#ffffff" stroke-width="2"/>
    <path d="M403 62L408 67L417 57" fill="none"/>
    <!-- self-regulation: clock -->
    <circle cx="410" cy="135" r="28" fill="#f2a48c"/>
    <circle cx="410" cy="135" r="15" fill="#ffffff" stroke-width="2"/>
    <path d="M410 127V135L416 139" fill="none"/>
    <!-- interpersonal guidance: two heads facing, heart -->
    <circle cx="410" cy="206" r="28" fill="#a9c8e8"/>
    <path d="M391 222C391 215 395 212 401 212C407 212 411 215 411 222Z" fill="#ffffff" stroke-width="2"/>
    <path d="M409 222C409 215 413 212 419 212C425 212 429 215 429 222Z" fill="#ffffff" stroke-width="2"/>
    <circle cx="401" cy="203" r="7" fill="#ffffff" stroke-width="2"/>
    <circle cx="419" cy="203" r="7" fill="#ffffff" stroke-width="2"/>
    <circle cx="404" cy="203" r="1.5" fill="#1f2937" stroke="none"/>
    <circle cx="416" cy="203" r="1.5" fill="#1f2937" stroke="none"/>
    <path d="M410 196C404 192 404 186 407.5 186C409 186 410 187 410 188.5C410 187 411 186 412.5 186C416 186 416 192 410 196Z" fill="#f2a48c" stroke-width="1.5"/>
  </g>
</svg>
